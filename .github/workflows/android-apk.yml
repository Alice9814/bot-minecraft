name: Build experimental Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "desktop_app.py"
      - "bot.py"
      - "local_llm.py"
      - "interface_bundle.py"
      - "interface/**"
      - "config.json"
      - "requirements.txt"
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android ARM64 experimental APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libdouble-conversion3

      - name: Install Qt for Python deployment tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.12.0"
          python -m pip install "markupsafe==2.0.1" Jinja2 tqdm packaging
          ANDROID_REQUIREMENTS="$(python -c 'import pathlib, PySide6; print(pathlib.Path(PySide6.__file__).parent / "scripts" / "requirements-android.txt")')"
          python -m pip install -r "$ANDROID_REQUIREMENTS"

      - name: Validate Python source files
        run: python -m py_compile main.py desktop_app.py bot.py local_llm.py interface_bundle.py

      - name: Download Android ARM64 Qt wheels
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/android/wheels"
          cd "$GITHUB_WORKSPACE/android/wheels"

          # Download the official public Qt for Python Android ARM64 wheels.
          curl --fail --location --retry 5 --retry-all-errors \
            "https://download.qt.io/official_releases/QtForPython/pyside6/pyside6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl" \
            --output "pyside6-6.12.0-android_aarch64.whl"

          curl --fail --location --retry 5 --retry-all-errors \
            "https://download.qt.io/official_releases/QtForPython/shiboken6/shiboken6-6.12.0-6.12.0-cp310-abi3-android_aarch64.whl" \
            --output "shiboken6-6.12.0-android_aarch64.whl"

          PYSIDE_WHEEL="$(find . -maxdepth 1 -type f -iname 'pyside6-*.whl' -print -quit)"
          SHIBOKEN_WHEEL="$(find . -maxdepth 1 -type f -iname 'shiboken6-*.whl' -print -quit)"

          if [ -z "$PYSIDE_WHEEL" ] || [ -z "$SHIBOKEN_WHEEL" ]; then
            echo "Could not download both Android ARM64 Qt wheels."
            ls -lah
            exit 1
          fi

          echo "Downloaded wheels:"
          ls -lh "$PYSIDE_WHEEL" "$SHIBOKEN_WHEEL"

      - name: Download Android SDK and NDK required by Qt
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 6.12 https://code.qt.io/pyside/pyside-setup.git "$RUNNER_TEMP/pyside-setup"
          cd "$RUNNER_TEMP/pyside-setup"

          python -m pip install -r tools/cross_compile_android/requirements.txt
          python -m pip install packaging

          python tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Build experimental APK
        shell: bash
        run: |
          set -euo pipefail

          PYSIDE_WHEEL="$(find android/wheels -maxdepth 1 -type f -iname 'pyside6-*.whl' -print -quit)"
          SHIBOKEN_WHEEL="$(find android/wheels -maxdepth 1 -type f -iname 'shiboken6-*.whl' -print -quit)"

          test -n "$PYSIDE_WHEEL"
          test -n "$SHIBOKEN_WHEEL"

          # Patch the installed PySide6 Android manifest generator.
          # Search site-packages recursively because its package directory
          # differs between PySide6 releases.
          python - <<'PY'
          from pathlib import Path
          import re
          import site

          candidates = []
          for base in site.getsitepackages():
              root = Path(base)
              if root.exists():
                  candidates.extend(root.rglob("buildozer.py"))

          candidates = [
              path for path in candidates
              if "deploy_lib" in path.parts and "android" in path.parts
          ]
          if not candidates:
              raise SystemExit(
                  "Could not locate buildozer.py under site-packages. "
                  "Searched: " + ", ".join(site.getsitepackages())
              )

          source_path = candidates[0]
          source = source_path.read_text(encoding="utf-8")
          if "android:usesCleartextTraffic" not in source:
              pattern = re.compile(r"(?m)^(\\s*)self\\.update_config\\(\\)\\s*$")
              match = pattern.search(source)
              if not match:
                  raise SystemExit(
                      f"Found {source_path}, but could not find self.update_config()"
                  )

              indent = match.group(1)
              setting = (
                  indent
                  + 'self.set_value("app", "android.extra_manifest_application_arguments", '
                  + '\'android:usesCleartextTraffic="true"\', raise_warning=False)\\n'
              )
              source = source[:match.start()] + setting + source[match.start():]
              source_path.write_text(source, encoding="utf-8")

          print(f"Patched Android manifest generator: {source_path}")
          PY

          pyside6-android-deploy \
            --name ProtoBot \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --force \
            --keep-deployment-files \
            --verbose

          mkdir -p dist
          APK_PATH="$(find . -path './.git' -prune -o -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "The Android deployment command finished but no APK was found."
            exit 1
          fi

          cp "$APK_PATH" dist/ProtoBot-android-arm64-experimental.apk
          ls -lh dist/ProtoBot-android-arm64-experimental.apk

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtoBot-android-arm64-experimental
          path: dist/ProtoBot-android-arm64-experimental.apk
          if-no-files-found: error
          retention-days: 14
