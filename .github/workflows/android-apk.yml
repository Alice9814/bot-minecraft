name: Build experimental Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "desktop_app.py"
      - "interface/**"
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android ARM64 experimental APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            libffi-dev libssl-dev zlib1g-dev \
            libncurses5-dev libncursesw5-dev

      - name: Install Qt for Python deployment tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PySide6==6.12.0" qtpip

      - name: Download Android ARM64 Qt wheels
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/android/wheels"
          cd "$GITHUB_WORKSPACE/android/wheels"
          qtpip download PySide6 --android --arch aarch64
          qtpip download shiboken6 --android --arch aarch64
          echo "PySide6 wheel:"
          find . -maxdepth 1 -type f -iname 'pyside6-*.whl' -print
          echo "Shiboken6 wheel:"
          find . -maxdepth 1 -type f -iname 'shiboken6-*.whl' -print

      - name: Download Android SDK and NDK required by Qt
        run: |
          git clone --depth 1 --branch 6.12 https://code.qt.io/pyside/pyside-setup.git "$RUNNER_TEMP/pyside-setup"
          cd "$RUNNER_TEMP/pyside-setup"
          python tools/cross_compile_android/main.py \
            --download-only \
            --skip-update \
            --auto-accept-license

      - name: Build experimental APK
        shell: bash
        run: |
          PYSIDE_WHEEL="$(find android/wheels -maxdepth 1 -type f -iname 'pyside6-*.whl' -print -quit)"
          SHIBOKEN_WHEEL="$(find android/wheels -maxdepth 1 -type f -iname 'shiboken6-*.whl' -print -quit)"

          test -n "$PYSIDE_WHEEL"
          test -n "$SHIBOKEN_WHEEL"

          pyside6-android-deploy \
            --name ProtoBot \
            --wheel-pyside="$PYSIDE_WHEEL" \
            --wheel-shiboken="$SHIBOKEN_WHEEL" \
            --force \
            --keep-deployment-files \
            --verbose

          mkdir -p dist
          APK_PATH="$(find . -path './.git' -prune -o -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "The Android deployment command finished but no APK was found."
            exit 1
          fi
          cp "$APK_PATH" dist/ProtoBot-android-arm64-experimental.apk
          ls -lh dist/ProtoBot-android-arm64-experimental.apk

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: ProtoBot-android-arm64-experimental
          path: dist/ProtoBot-android-arm64-experimental.apk
          if-no-files-found: error
          retention-days: 14
